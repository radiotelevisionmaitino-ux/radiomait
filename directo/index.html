<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Maitino | Señal en Directo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #181818;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #282828;
            max-width: 400px;
            width: 100%;
        }
        .badge {
            display: inline-block;
            background: #d0021b;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 100px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        h1 { font-size: 1.4rem; margin-bottom: 8px; font-weight: 600; }
        p { color: #888; font-size: 0.9rem; margin-bottom: 25px; }
        audio {
            width: 100%;
            outline: none;
            border-radius: 30px;
        }
    </style>
    <!-- Cargamos la librería PeerJS si usas directos por voz -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div class="container">
        <span class="badge">● En Directo</span>
        <h1>Radio Maitino</h1>
        <p>Emisión digital continuada</p>
        
        <!-- Reproductor Puro Nativo -->
        <audio id="deck-a" controls autoplay playsinline></audio>
        
        <!-- Decks de apoyo ocultos requeridos por el motor de script.js -->
        <audio id="deck-b" preload="metadata" playsinline hidden></audio>
        <audio id="external-live-audio" autoplay playsinline hidden></audio>
    </div>

    <!-- Elementos invisibles requeridos por la lógica de script.js para evitar errores de consola -->
    <div style="display:none;">
        <span id="clock"></span><span id="main-title"></span><span id="sub-title"></span>
        <img id="art-img" src="" alt=""><canvas id="visualizer-canvas"></canvas>
        <span id="status-badge"></span><span id="tally"></span><button id="pwr-btn"></button>
        <div id="schedule-list"></div><div id="news-banner-container"><div id="news-banner-text"></div></div>
    </div>

    <!-- Carga de la lógica pura que ya creamos -->
    <script src="../script.js"></script>
    <script>
        // Forzar arranque automático del motor de emisión en modo directo
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (typeof toggleBroadcast === 'function' && !systemOn) {
                    toggleBroadcast();
                }
            }, 500);
        });
    </script>
</body>
</html>
